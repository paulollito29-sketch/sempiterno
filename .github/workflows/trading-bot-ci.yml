name: trading-bot CI

on:
  push:
    paths:
      - 'trading-bot/**'
      - '.github/workflows/trading-bot-ci.yml'
  pull_request:
    paths:
      - 'trading-bot/**'

jobs:
  engine:
    name: Motor (Python) — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading-bot/engine/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (sin red)
        run: pytest -q -m "not network"

  dashboard:
    name: Panel (React) — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trading-bot/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
