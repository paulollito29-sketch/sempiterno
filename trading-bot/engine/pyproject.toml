[project]
name = "cryptobot"
version = "0.1.0"
description = "Asistente cuantitativo de trading cripto: recomendaciones cada 20 min para operar en Lemon + conector API opcional."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "hmmlearn>=0.3.2",
    "ccxt>=4.3",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[project.scripts]
cryptobot = "cryptobot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests que requieren acceso a internet (se saltan en CI)",
    "slow: tests lentos",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
